<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline wydawniczy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__row">
    <div class="brand">
      <span class="brand__mark">TdW</span>
      <span class="brand__text">
        <span class="brand__title" id="siteTitle">Pipeline wydawniczy</span>
        <span class="brand__sub" id="siteSubtitle">Od angielskiego manuskryptu do wydanej książki</span>
      </span>
    </div>

    <div class="book">
      <span class="book__label">Książka w toku</span>
      <span class="book__name" id="bookName" contenteditable="true" spellcheck="false"></span>
    </div>

    <div class="global">
      <div class="global__bar"><i id="globalBar"></i></div>
      <span class="global__count" id="globalCount">0 / 0</span>
    </div>

    <div class="actions">
      <button class="btn" id="btnExport" title="Kopia zapasowa całości jako plik JSON">Eksport JSON</button>
      <label class="btn" for="fileImport" title="Wczytaj szablon z pliku JSON">Import JSON</label>
      <input type="file" id="fileImport" accept="application/json,.json" hidden>
      <button class="btn" id="btnNewBook" title="Wyzeruj postęp bieżącego tytułu, szablon zostaje">Nowa książka</button>
      <span class="saveflag" id="saveFlag"></span>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Etapy procesu"></nav>
</header>

<main class="sheet" id="stage"></main>

<footer class="foot">
  <span>Szablon uniwersalny, wersja <b id="tplVersion">–</b> · aktualizacja <b id="tplUpdated">–</b></span>
  <span class="foot__hint">Zmiany struktury zapisują się wprost do szablonu i wchodzą w kolejne książki. Statusy i odhaczenia zostają przy tym tytule.</span>
</footer>

<script src="/js/storage.js"></script>
<script src="/js/pipeline.js"></script>
</body>
</html>
